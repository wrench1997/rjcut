# FRP 服务端部署配置 - 公网服务器

# frps.ini - FRP 服务端配置文件
[common]
# 绑定端口，用于接收客户端连接
bind_port = 7000
# KCP 绑定端口（可选，加速用）
kcp_bind_port = 7000
# 认证令牌
token = rjcut_secure_token_2024
# 仪表板地址
dashboard_addr = 0.0.0.0
# 仪表板端口
dashboard_port = 7500
# 仪表板用户名
dashboard_user = admin
# 仪表板密码
dashboard_pwd = RjCut@2024Admin
# 日志级别
log_level = info
# 日志文件路径
log_file = /frp/log/frps.log
# 日志最大天数
log_max_days = 7
# 子域名配置（可选）
# subdomain_host = yourdomain.com
# 允许的最大端口数
max_ports_per_client = 10
# 心跳超时设置
heartbeat_timeout = 90
# 心跳间隔
heartbeat_interval = 30

# 限制每个客户端的最大连接数（可选）
# max_pool_count = 5
# TCP 多路复用
tcp_mux = true

# 启用 HTTPS（可选）
# vhost_https_port = 443
# vhost_http_port = 80