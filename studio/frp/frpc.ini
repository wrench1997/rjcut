# FRP 客户端配置 - 用于本地服务器
[common]
# 公网服务器地址
server_addr = 112.111.7.91
# 公网服务器 FRP 端口
server_port = 7000
# 认证令牌（需与服务端一致）
token = rjcut_secure_token_2024
# 日志级别
log_level = info
# 日志文件路径
log_file = /frp/log/frpc.log
# 管理界面地址
admin_addr = 0.0.0.0
admin_port = 7400

# HTTP 服务穿透 - Studio 前端
[studio-http]
type = http
local_port = 80
custom_domains = studio.yourdomain.com
# 或者使用子域名
# subdomain = studio

# HTTPS 服务穿透（可选，如需 HTTPS）
# [studio-https]
# type = https
# local_port = 80
# custom_domains = studio.yourdomain.com

# API 服务穿透 - 后端 API 服务
[studio-api]
type = tcp
local_ip = 192.168.166.151
local_port = 8001
remote_port = 8001