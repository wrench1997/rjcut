version: '3.8'

services:
  # AI 通讯网关 - Codex Gateway
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: rjcut-gateway
    ports:
      - "8888:8888"
    environment:
      - VLLM_BASE_URL=http://112.111.7.91:7980
      - MODEL_NAME=Qwen/Qwen3.5-397B-A17B-FP8
      - POLL_INTERVAL=5
      - INPUT_PRICE_PER_1M=3.0
      - OUTPUT_PRICE_PER_1M=6.0
      - CACHED_INPUT_PRICE_PER_1M=0.025
      - TTFT_CACHE_HIT_THRESHOLD=0.5
      - GATEWAY_BASE_URL=http://gateway:8888
    restart: unless-stopped
    networks:
      - studio-network

  # FRP 客户端服务 - 用于内网穿透
  frp-client:
    build:
      context: ./frp
      dockerfile: Dockerfile
    container_name: rjcut-frp-client
    volumes:
      - ./frp/frpc.ini:/frp/frpc.ini
      - frp-logs:/frp/log
    ports:
      - "7400:7400"  # FRP 管理界面
    restart: unless-stopped
    depends_on:
      - studio-prod
      - gateway
    networks:
      - studio-network

  # 开发环境服务
  studio-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rjcut-studio-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://192.168.166.151:8001
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

  # 生产环境服务（构建并运行静态服务器）
  studio-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rjcut-studio-prod
    ports:
      - "80:80"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://192.168.166.151:8001
    restart: unless-stopped
    depends_on:
      - studio-dev
    networks:
      - studio-network

# 定义网络
networks:
  studio-network:
    driver: bridge

# 定义数据卷
volumes:
  frp-logs:
