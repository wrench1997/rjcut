version: '3.8'

services:
  # FRP 客户端服务 - 用于内网穿透
  frp-client:
    build:
      context: ./frp
      dockerfile: Dockerfile
    container_name: rjcut-frp-client
    volumes:
      - ./frp/frpc.ini:/frp/frpc.ini
      - frp-logs:/frp/log
    ports:
      - "7400:7400"  # FRP 管理界面
    restart: unless-stopped
    depends_on:
      - studio-prod
    networks:
      - studio-network

  # 开发环境服务
  studio-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rjcut-studio-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

  # 生产环境服务（构建并运行静态服务器）
  studio-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rjcut-studio-prod
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    restart: unless-stopped
    depends_on:
      - studio-dev
    networks:
      - studio-network

# 定义网络
networks:
  studio-network:
    driver: bridge

# 定义数据卷
volumes:
  frp-logs: