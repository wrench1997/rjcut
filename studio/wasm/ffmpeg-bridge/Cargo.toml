[package]
name = "ffmpeg-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2.92", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.42"
js-sys = "0.3.69"
web-sys = { version = "0.3.69", features = [
    "console",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "MessageEvent",
    "MessageChannel",
    "MessagePort",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Window",
    "Performance",
    "File",
    "FileReader",
    "ProgressEvent",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
thiserror = "1.0"
log = "0.4"
console_log = "1.0"
console_error_panic_hook = "0.1.7"
futures = "0.3"