[package]
name = "video-engine"
version = "0.1.0"
edition = "2021"
description = "高性能浏览器端视频编辑引擎 (WASM)"
license = "MIT"
repository = "https://github.com/your-org/video-engine"
keywords = ["video", "editor", "wasm", "webassembly", "timeline"]
categories = ["multimedia", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2.92", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.42"
js-sys = "0.3.69"
web-sys = { version = "0.3.69", features = [
    "console",
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "ImageData",
    "VideoFrame",
    "AudioContext",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "GainNode",
    "OffscreenCanvas",
    "Worker",
    "MessageEvent",
    "Performance",
    "Window",
    "Document",
    "Element",
    "DomRect",
    "VideoDecoder",
    "VideoDecoderConfig",
    "VideoDecoderInit",
    "EncodedVideoChunk",
    "EncodedVideoChunkInit",
    "EncodedVideoChunkType",
    "VideoFrame",
    "VideoFrameInit",
]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
thiserror = "1.0"
log = "0.4"
console_log = "1.0"
wee_alloc = { version = "0.4", optional = true }
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies.console_error_panic_hook]
version = "0.1.7"
optional = true

[dev-dependencies]
wasm-bindgen-test = "0.3.42"