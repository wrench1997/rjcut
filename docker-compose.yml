
x-common-env: &common-env
  DATABASE_URL: postgresql://rjcut:rjcut_secret_2024@postgres:5432/rjcut
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: 192.168.166.151:9003
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: rjcut
  MINIO_USE_SSL: "false"
  MINIO_EXTERNAL_ENDPOINT: http://192.168.166.151:9003
  TASK_TIMEOUT_SECONDS: "360"
  TASK_STALE_CHECK_INTERVAL: "60"
  SECRET_KEY: change_me_in_production_2024
  RQ_QUEUE_NAME: rjcut_tasks
  PYTHONUNBUFFERED: "1"
  CHANJING_APP_ID: itop
  CHANJING_SECRET_KEY: rj-itop+0591
  # 生产请配置公网可达的蝉镜服务地址（禁止写死内网 IP）
  CHANJING_BASE_URL: ${CHANJING_BASE_URL}
  CHANJING_FILES_URL: ${CHANJING_FILES_URL}
  ALLOW_PRIVATE_CHANJING: ${ALLOW_PRIVATE_CHANJING:-true}

services:
# --- 新增 Loki 监控组件 ---
  loki:
    image: grafana/loki:latest
    container_name: rjcut_loki
    ports:
      - "3100:3100"
    volumes:
      - /opt/rjcut/loki_data:/loki 
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - rjcut-network

  promtail:
    image: grafana/promtail:latest
    container_name: rjcut_promtail
    restart: always
    volumes:
      # 关键：挂载 Docker 容器日志目录
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - rjcut-network

  grafana:
    image: grafana/grafana:latest
    container_name: rjcut_grafana
    ports:
      - "3000:3000"
    volumes:
      - /opt/rjcut/grafana_data:/var/lib/grafana
    restart: always
    depends_on:
      - loki
    networks:
      - rjcut-network
  postgres:
    image: postgres:17
    container_name: rjcut_postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: rjcut
      POSTGRES_USER: rjcut
      POSTGRES_PASSWORD: rjcut_secret_2024
    volumes:
      - /opt/rjcut/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rjcut -d rjcut"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - rjcut-network

  redis:
    image: redis:7-alpine
    container_name: rjcut_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - /opt/rjcut/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - rjcut-network

  minio:
    image: minio/minio:latest
    container_name: rjcut_minio
    restart: always
    ports:
      - "9003:9000"      # ← 主机用 9003（避开冲突），容器内 API 还是 9000
      - "9002:9001"      # Console 用主机 9002 访问
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - /opt/minio/data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - rjcut-network

  # AI 网关服务
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: rjcut-gateway
    ports:
      - "8888:8888"
    environment:
      - VLLM_BASE_URL=http://112.111.7.91:7980
      - MODEL_NAME=Qwen/Qwen3.5-397B-A17B-FP8
      - POLL_INTERVAL=5
      - INPUT_PRICE_PER_1M=3.0
      - OUTPUT_PRICE_PER_1M=6.0
      - CACHED_INPUT_PRICE_PER_1M=0.025
      - TTFT_CACHE_HIT_THRESHOLD=0.5
      - GATEWAY_BASE_URL=http://gateway:8888
      - UPSTREAM_CONNECT_TIMEOUT=8
      - UPSTREAM_READ_TIMEOUT=240
      - UPSTREAM_WRITE_TIMEOUT=30
      - UPSTREAM_MAX_RETRIES=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - rjcut-network

  api:
    image: rjcut:latest
    container_name: rjcut_api
    restart: always
    ports:
      - "8001:8000"
    environment:
      <<: *common-env
      GATEWAY_BASE_URL: http://gateway:8888
    volumes:
      - ./:/app          # 开发时建议加 :ro（只读），避免意外修改；生产去掉 ro
      - /opt/rjcut/service_data:/app/service_data   # 这个持久化目录保持 rw
      - ./fonts:/app/fonts:ro    # ← 新增：显式只读挂载 fonts 目录
      - /root/MuseTalk/data/video:/root/MuseTalk/data/video:ro    # 蝉镜数字人封面图目录
    working_dir: /app       # 强制工作目录为 /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      gateway:
        condition: service_started
    command: bash -c "python /app/scripts/init_db.py && uvicorn api_service:app --host 0.0.0.0 --port 8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - rjcut-network

  worker:
    image: rjcut:latest
    container_name: rjcut_worker
    restart: always
    environment:
      <<: *common-env
    volumes:
      - ./:/app
      - /opt/rjcut/service_data:/app/service_data   # 持久化任务数据目录
      - ./fonts:/app/fonts:ro    # 字体文件只读挂载
    working_dir: /app          # 强制工作目录
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: python -u /app/worker.py   # 加 -u 确保输出不缓冲（配合 PYTHONUNBUFFERED）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - rjcut-network

  task_watchdog:
    image: rjcut:latest
    container_name: rjcut_watchdog
    restart: always
    environment:
      <<: *common-env
    volumes:
      - ./:/app
      - /opt/rjcut/service_data:/app/service_data   # 持久化任务数据目录
      - ./fonts:/app/fonts:ro    # 字体文件只读挂载
    working_dir: /app          # 强制工作目录
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -u /app/task_watchdog.py
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - rjcut-network

# 定义网络 - 所有服务在同一网络内通信
networks:
  rjcut-network:
    driver: bridge
